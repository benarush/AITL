[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-in-the-loop"
version = "0.2.2"
description = "Client library for Agent In The Loop confidence evaluation API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Tomer Ben Harush" },
]
keywords = ["agent", "llm", "opentelemetry", "confidence", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
langchain = [
    "langchain-core>=0.1",
]

[tool.setuptools.packages.find]
include = ["agent_in_the_loop*"]

[project.urls]
Homepage = "https://github.com/benarush/AITL"
"Bug Tracker" = "https://github.com/benarush/AITL/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
